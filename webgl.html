  <script type="module">

    // import from threejs
    import * as THREE from 'three';

    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
    import { AsciiEffect } from 'three/addons/effects/AsciiEffect.js';

    // create variables
    let camera, scene, model, controls;
    let screenTexture, ctx, envTexture;

    let isFocusing = false;
    let focusStartTime = 2;
    let focusDuration = 3.0; // seconds
    let startCameraPosition, startCameraTarget, endCameraPosition;

    let hdrLoader = new RGBELoader(); // reuse the loader
    let currentTrackUrl = ''; // variable to store the current track URL
    let screenMesh = null; // store your screen panel here
    let rotationSpeed = 1;

    // hdri maps
   const environmentTextures = [
  'assets/TrainStation.hdr',
  'assets/royal_esplanade_1k.hdr',
  'assets/kloppenheim_02_4k.hdr',
  'assets/lakeside_night_4k.hdr',
  'assets/pedestrian_overpass_4k.hdr',
  'assets/little_paris_under_tower_4k.hdr',
  'assets/meadow_4k.hdr'
];

function getRandomEnvironmentIndex() {
  return Math.floor(Math.random() * environmentTextures.length);
}

let currentEnvironmentIndex = getRandomEnvironmentIndex();

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const clock = new THREE.Clock();

    var fovSlider = document.getElementById("fovRange");
    let fov = fovSlider.value;
    fovSlider.oninput = function () {
      fov = this.value;
    }

    var rotxSlider = document.getElementById("rotateX");
    let rotX = rotxSlider.value;
    rotxSlider.oninput = function () {
      rotX = this.value;
    }

    var rotySlider = document.getElementById("rotateY");
    let rotY = rotySlider.value;
    rotySlider.oninput = function () {
      rotY = this.value;
    }

    var rotzSlider = document.getElementById("rotateZ");
    let rotZ = rotzSlider.value;
    rotzSlider.oninput = function () {
      rotZ = this.value;
    }

//      const targetPosition = new THREE.Vector3(0.489, -0.749, -0.526); // Focus on a point slightly above center
// const targetRotation = { x: 123.2, y: 26.6, z: -145.7 }; // 20 degree downward tilt

    let camPosX = 0.489;
    let camPosY = -26.25;//0.749
    let camPosZ = -0.5;//!
    let camRotX = 123.2;
    let camRotY = 26.6;
    let camRotZ = -145.7;

    // const rotateX = document.getElementById('rotateX');
    // const rotateY = document.getElementById('rotateY');
    // const rotateZ = document.getElementById('rotateZ');

    // function updateModelRotation() {
    //   model.rotation.x = THREE.MathUtils.degToRad(rotateX.value);
    //   model.rotation.y = THREE.MathUtils.degToRad(rotateY.value);
    //   model.rotation.z = THREE.MathUtils.degToRad(rotateZ.value);
    // }

    // rotateX.addEventListener('input', updateModelRotation);
    // rotateY.addEventListener('input', updateModelRotation);
    // rotateZ.addEventListener('input', updateModelRotation);

    var canvas = document.getElementsByTagName("canvas")[0];

    var renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      alpha: true
    });
    renderer.setSize(window.innerWidth, window.innerHeight);

    // initiate app
    init();

    function loadEnvironmentTexture(index) {
      const texturePath = environmentTextures[index];

      hdrLoader.load(texturePath, function (texture) {
        texture.mapping = THREE.EquirectangularReflectionMapping;
        scene.environment = texture;
        scene.background = texture;
        console.log(`Environment set to: ${texturePath}`);
        render();
      });
    }

    // spotify get now playing track function
    let pausedStartTime = null;
    const PAUSE_TIMEOUT = 60 * 1000; // 60 seconds in ms

    const favouriteTrack = {
      trackName: 'BUFFALO (feat. Shane Powers)',
      artistName: 'Tyler, The Creator & Shane Powers',
      albumName: 'CHERRY BOMB',
      albumImageUrl: 'assets/cherrybombCover.jpg',
      progressMs: 125000,
      durationMs: 160000,
      isPlaying: false,
      trackUrl: 'https://neal.fun'
    };

    async function fetchNowPlaying() {
      try {
        const response = await fetch('/.netlify/functions/getCurrentTrack');
        const data = await response.json();

        console.log('Fetched data:', data);

        // Check if there's valid Spotify data
        const isValidTrack = data && data.name && data.artists;

        if (isValidTrack) {
          const mappedTrackInfo = {
            trackName: data.name,
            artistName: data.artists,
            albumName: data.album,
            albumImageUrl: data.album_image,
            progressMs: data.progress_ms,
            durationMs: data.duration_ms,
            isPlaying: data.is_playing,
            trackUrl: data.track_url
          };

          if (data.is_playing) {
            pausedStartTime = null;
            updateScreen(mappedTrackInfo);
          } else {
            if (!pausedStartTime) pausedStartTime = Date.now();
            const elapsed = Date.now() - pausedStartTime;

            if (elapsed >= PAUSE_TIMEOUT) {
              updateScreen(favouriteTrack);
            } else {
              updateScreen(mappedTrackInfo);
            }
          }

        } else {
          // If invalid data, fallback immediately
          pausedStartTime = null;
          updateScreen(favouriteTrack);
        }
      } catch (error) {
        console.error('Error fetching track info:', error);
        pausedStartTime = null;
        updateScreen(favouriteTrack);
      }
    }

    function updateScreen(trackInfo) {
      if (!canvas || !ctx) {
        console.error('Canvas or ctx is not initialized');
        return;
      }

      const { trackName, artistName, albumName, progressMs, durationMs } = trackInfo; // create variables for track info

      console.log('Updating screen with:', trackInfo);

      // clear screen
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // create background
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, '#111111');
      gradient.addColorStop(1, '#333333');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // load spotify image (album cover)
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = trackInfo.albumImageUrl || 'assets/cherrybombCover.jpg';

      img.onload = () => {
        const imgSize = 120;
        const imgX = (canvas.width - imgSize) / 2; // center horizontally
        const imgY = 30; // top padding

        const radius = 15;

        // draw image
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(imgX + radius, imgY);
        ctx.lineTo(imgX + imgSize - radius, imgY);
        ctx.quadraticCurveTo(imgX + imgSize, imgY, imgX + imgSize, imgY + radius);
        ctx.lineTo(imgX + imgSize, imgY + imgSize - radius);
        ctx.quadraticCurveTo(imgX + imgSize, imgY + imgSize, imgX + imgSize - radius, imgY + imgSize);
        ctx.lineTo(imgX + radius, imgY + imgSize);
        ctx.quadraticCurveTo(imgX, imgY + imgSize, imgX, imgY + imgSize - radius);
        ctx.lineTo(imgX, imgY + radius);
        ctx.quadraticCurveTo(imgX, imgY, imgX + radius, imgY);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(img, imgX, imgY, imgSize, imgSize);
        ctx.restore();

        // draw text
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';

        // track name
        ctx.font = 'bold 18px Arial';
        ctx.fillText(trackName, canvas.width / 2, imgY + imgSize + 40);

        // artist name
        ctx.font = '16px Arial';
        ctx.fillText(artistName, canvas.width / 2, imgY + imgSize + 70);

        // album name
        ctx.font = '14px Arial';
        ctx.fillText('Album: ' + albumName, canvas.width / 2, imgY + imgSize + 95);

        // call the progress bar function
        drawProgressBar(progressMs, durationMs);

        // call the battery icon drawing function
        drawBatteryIcon();

        // call the pause/play button drawing function
        drawPlayPauseButton(trackInfo.isPlaying);

        // update screen texture
        screenTexture.needsUpdate = true;
        currentTrackUrl = trackInfo.trackUrl;
      };

      img.onerror = (error) => {
        console.error('Failed to load album cover image:', error);
      };
    }

    function drawPlayPauseButton(isPlaying) {
      const iconX = 30; // top-left corner
      const iconY = 20;
      const iconSize = 20;

      ctx.fillStyle = '#ffffff';

      if (isPlaying) {
        // draw pause button
        ctx.fillRect(iconX, iconY, 5, iconSize);
        ctx.fillRect(iconX + 10, iconY, 5, iconSize);
      } else {
        // draw play button
        ctx.beginPath();
        ctx.moveTo(iconX, iconY);
        ctx.lineTo(iconX, iconY + iconSize);
        ctx.lineTo(iconX + 15, iconY + iconSize / 2);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawProgressBar(progressMs, durationMs) {
      const barWidth = canvas.width * 0.6;
      const barHeight = 8;
      const barX = (canvas.width - barWidth) / 2;
      const barY = canvas.height - 40; // near the bottom

      if (durationMs <= 0) return;

      const progress = Math.min(progressMs / durationMs, 1); // clamp to [0,1]

      // background bar
      ctx.fillStyle = '#555555';
      ctx.fillRect(barX, barY, barWidth, barHeight);

      // progress bar
      ctx.fillStyle = '#1DB954'; // spotify green code
      ctx.fillRect(barX, barY, barWidth * progress, barHeight);
    }

    // draw battery icon function
    function drawBatteryIcon() {
      const batteryX = canvas.width - 50;
      const batteryY = 20;
      const batteryWidth = 30;
      const batteryHeight = 12;

      // battery outer rectangle
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.strokeRect(batteryX, batteryY, batteryWidth, batteryHeight);

      // battery end
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(batteryX + batteryWidth, batteryY + 3, 4, 6);

      // battery %
      ctx.fillStyle = '#00ff00';
      ctx.fillRect(batteryX + 2, batteryY + 2, batteryWidth * 0.7 - 4, batteryHeight - 4);
    }

    function init() {
      const container = document.createElement('div');
      document.body.appendChild(container);

      // set up the camera fov 35mm
      camera = new THREE.PerspectiveCamera(fov, window.innerWidth / window.innerHeight, 0.1, 20);
      camera.position.set(camPosX, camPosY, camPosZ);
      camera.rotation.set(
        THREE.MathUtils.degToRad(camRotX),
        THREE.MathUtils.degToRad(camRotY),
        THREE.MathUtils.degToRad(camRotZ)
      );

      // create scene
      scene = new THREE.Scene();

      // load the environment texture
      new RGBELoader().load('assets/little_paris_under_tower_4k.hdr', function (texture) {
        texture.mapping = THREE.EquirectangularReflectionMapping;
        scene.background = texture;
        scene.environment = texture;
        render();
      });

      // load the ipod model
      const loader = new GLTFLoader();
      loader.load('assets/scene.gltf', function (gltf) {
        model = gltf.scene;
        model.rotation.x = THREE.MathUtils.degToRad(rotX);
        model.rotation.y = THREE.MathUtils.degToRad(rotY);
        model.rotation.z = THREE.MathUtils.degToRad(rotZ);
        scene.add(model);

        // create canvas + texture for ipod screen
        canvas = document.createElement('canvas');
        canvas.width = 400;
        canvas.height = 330;
        ctx = canvas.getContext('2d');

        // create texture for screen
        screenTexture = new THREE.CanvasTexture(canvas);

        // create material using canvas texture
        const screenMaterial = new THREE.MeshBasicMaterial({ map: screenTexture, side: THREE.DoubleSide });

        // create 3d plane for ipod screen with updated dimensions
        const screenGeometry = new THREE.PlaneGeometry(0.08, 0.066);  // adjusted dimensions
        const screen = new THREE.Mesh(screenGeometry, screenMaterial);

        screenMesh = screen; // <-- save reference globally

        // place new screen onto the model
        screen.position.set(0.009, 0.0545, 0); // new screen position
        screen.rotation.set(0, Math.PI / 2, 0); // new screen rotation

        // add new screen to ipod
        model.add(screen);
        model.scale.set(5, 5, 5); // scale up screen

        document.getElementById('prevEnv').addEventListener('click', function () {
          currentEnvironmentIndex = (currentEnvironmentIndex - 1 + environmentTextures.length) % environmentTextures.length;
          loadEnvironmentTexture(currentEnvironmentIndex);
        });

        document.getElementById('nextEnv').addEventListener('click', function () {
          currentEnvironmentIndex = (currentEnvironmentIndex + 1) % environmentTextures.length;
          loadEnvironmentTexture(currentEnvironmentIndex);
        });

        function focusOnScreen() {
          if (!screenMesh) return;

          const screenWorldPosition = new THREE.Vector3();
          screenMesh.getWorldPosition(screenWorldPosition);

          const screenWorldNormal = new THREE.Vector3(0, 0, 1);
          screenWorldNormal.applyQuaternion(screenMesh.getWorldQuaternion(new THREE.Quaternion())).normalize();

          const distance = 1;
          endCameraPosition = screenWorldPosition.clone().add(screenWorldNormal.multiplyScalar(distance));

          startCameraPosition = camera.position.clone();
          startCameraTarget = controls.target.clone();

          focusStartTime = performance.now() / 1000;
          isFocusing = true;
        }

        function loadFocus(targetPosition, targetRotation, distance = 1) {
    if (!model || !camera || !controls) return;

    // Store initial state for animation
    startCameraPosition = camera.position.clone();
    startCameraTarget = controls.target.clone();
    
    // Calculate end position based on target position and distance
    const direction = new THREE.Vector3();
    camera.getWorldDirection(direction); // Gets camera's forward vector
    direction.multiplyScalar(-distance); // Reverse and scale by distance
    
    endCameraPosition = new THREE.Vector3().copy(targetPosition).add(direction);
    
    // Set target rotation (convert to Quaternion for smooth interpolation)
    const endRotation = new THREE.Quaternion().setFromEuler(
        new THREE.Euler(
            THREE.MathUtils.degToRad(targetRotation.x),
            THREE.MathUtils.degToRad(targetRotation.y),
            THREE.MathUtils.degToRad(targetRotation.z),
            'XYZ'
        )
    );
    
    // Animation control
    focusStartTime = performance.now() / 1000;
    isFocusing = true;
    
    // Optional: Set OrbitControls target
    controls.target.copy(targetPosition);
}

        // Run on button click
        document.getElementById('focusObject').addEventListener('click', focusOnScreen);

        // Run on load (after Three.js scene is ready)
        window.addEventListener('load', () => {
          // If screenMesh isn't available immediately, wait until it is
          const checkMeshInterval = setInterval(() => {
            if (screenMesh) {
              focusOnScreen();
              clearInterval(checkMeshInterval);
            }
          }, 100);
        });


        document.getElementById('logDebug').addEventListener('click', () => {
          if (!model || !camera) {
            console.warn('Model or camera not loaded yet.');
            return;
          }

          // Log iPod info
          const ipodPosition = model.position;
          const ipodRotation = model.rotation;

          console.log('--- iPod Info ---');
          console.log(`Position: x=${ipodPosition.x.toFixed(3)}, y=${ipodPosition.y.toFixed(3)}, z=${ipodPosition.z.toFixed(3)}`);
          console.log(`Rotation (radians): x=${ipodRotation.x.toFixed(3)}, y=${ipodRotation.y.toFixed(3)}, z=${ipodRotation.z.toFixed(3)}`);
          console.log(`Rotation (degrees): x=${(THREE.MathUtils.radToDeg(ipodRotation.x)).toFixed(1)}°, y=${(THREE.MathUtils.radToDeg(ipodRotation.y)).toFixed(1)}°, z=${(THREE.MathUtils.radToDeg(ipodRotation.z)).toFixed(1)}°`);

          // Log camera info
          const camPosition = camera.position;
          const camRotation = camera.rotation;

          console.log('--- Camera Info ---');
          console.log(`Position: x=${camPosition.x.toFixed(3)}, y=${camPosition.y.toFixed(3)}, z=${camPosition.z.toFixed(3)}`);
          console.log(`Rotation (radians): x=${camRotation.x.toFixed(3)}, y=${camRotation.y.toFixed(3)}, z=${camRotation.z.toFixed(3)}`);
          console.log(`Rotation (degrees): x=${(THREE.MathUtils.radToDeg(camRotation.x)).toFixed(1)}°, y=${(THREE.MathUtils.radToDeg(camRotation.y)).toFixed(1)}°, z=${(THREE.MathUtils.radToDeg(camRotation.z)).toFixed(1)}°`);
          console.log(`FOV: ${camera.fov}°`);
          console.log(`Near plane: ${camera.near.toFixed(3)}`);
          console.log(`Far plane: ${camera.far.toFixed(3)}`);
        });

        loadEnvironmentTexture(currentEnvironmentIndex);
        fetchNowPlaying(); // fetch track info 
        updateModelRotation();
        updateCameraFov();
        setInterval(fetchNowPlaying, 1000); // update every 1 seconds
        setInterval(updateCameraFov, 1);
        setInterval(updateModelRotation, 1);
        const targetPosition = new THREE.Vector3(0.489, -0.749, -0.526); // Focus on a point slightly above center
const targetRotation = { x: 123.2, y: 26.6, z: -145.7 }; // 20 degree downward tilt
loadFocus(targetPosition, targetRotation, 0); // 0.8 units distance
      });

      // set up renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.85;
      renderer.setPixelRatio(window.devicePixelRatio);
      const header = document.getElementById('header'); // or whatever your header's ID is
      const headerHeight = header ? header.offsetHeight : 0;

      renderer.setSize(window.innerWidth, window.innerHeight - headerHeight);
      renderer.domElement.style.top = `${headerHeight}px`; // move canvas down
      renderer.domElement.style.position = 'absolute'; // make sure it's positioned

      container.appendChild(renderer.domElement);

      window.addEventListener('resize', onWindowResize);
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enablePan = false;

      renderer.domElement.addEventListener('click', function (event) {
        const header = document.getElementById('header');
        const headerHeight = header ? header.offsetHeight : 0;

        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -((event.clientY - headerHeight) / (window.innerHeight - headerHeight)) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        const intersects = raycaster.intersectObject(screenMesh);

        if (intersects.length > 0) {
          const intersect = intersects[0];

          // Get the normal in world space
          const normalMatrix = new THREE.Matrix3().getNormalMatrix(intersect.object.matrixWorld);
          const worldNormal = intersect.face.normal.clone().applyMatrix3(normalMatrix).normalize();

          // Get vector from intersection point to camera
          const cameraDirection = camera.position.clone().sub(intersect.point).normalize();

          // Dot product between normal and camera direction
          const dot = worldNormal.dot(cameraDirection);

          if (dot > 0) { // front side facing camera
            if (currentTrackUrl) {
              window.open(currentTrackUrl, '_blank');
            }
          }
        }
      });

      renderer.domElement.addEventListener('mousemove', function (event) {
        const header = document.getElementById('header');
        const headerHeight = header ? header.offsetHeight : 0;

        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -((event.clientY - headerHeight) / (window.innerHeight - headerHeight)) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        const intersects = raycaster.intersectObject(screenMesh);

        if (intersects.length > 0) {
          const intersect = intersects[0];

          // Get normal and check facing
          const normalMatrix = new THREE.Matrix3().getNormalMatrix(intersect.object.matrixWorld);
          const worldNormal = intersect.face.normal.clone().applyMatrix3(normalMatrix).normalize();
          const cameraDirection = camera.position.clone().sub(intersect.point).normalize();
          const dot = worldNormal.dot(cameraDirection);

          if (dot > 0) {
            renderer.domElement.style.cursor = 'pointer';
          } else {
            renderer.domElement.style.cursor = 'default';
          }
        } else {
          renderer.domElement.style.cursor = 'default';
        }
      });

      onWindowResize();
      render();
    }

    // window resize function
    function onWindowResize() {
      const header = document.getElementById('header');
      const headerHeight = header ? header.offsetHeight : 0;

      camera.aspect = window.innerWidth / (window.innerHeight - headerHeight);
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight - headerHeight);
    }

    function updateCameraFov() {
      camera.fov = fov;
      camera.updateProjectionMatrix();
    }

    function updateModelRotation() {
      model.rotation.x = THREE.MathUtils.degToRad(rotX);
      model.rotation.y = THREE.MathUtils.degToRad(rotY);
      model.rotation.z = THREE.MathUtils.degToRad(rotZ);
      model.updateMatrixWorld();
    }

    function easeInOutCubic(t) {
      // Bézier-like curve
      return t < 0.5
        ? 4 * t * t * t
        : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    // render function
    function render() {
  requestAnimationFrame(render);

  const currentTime = performance.now() / 1000; // seconds

  // Add your animation code here
  if (model && !isFocusing) { // Only animate when not focusing
    const elapsed = clock.getElapsedTime();
    model.rotation.y = THREE.MathUtils.degToRad(rotY) + (elapsed * rotationSpeed);
    // const bounceAmplitude = 0.2;
    // const bounceFrequency = 1;
    // const bounceWidth = 0.1;

  if (isFocusing) {
    const elapsedFocus = currentTime - focusStartTime;
    const t = Math.min(elapsedFocus / focusDuration, 1);
    const easedT = easeInOutCubic(t);

    camera.position.lerpVectors(startCameraPosition, endCameraPosition, easedT);
    controls.target.lerpVectors(startCameraTarget, screenMesh.position, easedT);
    controls.update();

    if (t >= 1) {
      isFocusing = false;
    }
  }

  controls.update();
  renderer.render(scene, camera);
}
