<html lang="en">

<head>

  <title>three.js webgl - GLTFloader</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">

    body {
      margin: 0;

      display: block;

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5P5GK6CQ" height="0" width="0"
      style="display:none;visibility:hidden"></iframe></noscript>

  <header id="header">
    <div class="container">

      <div id="controls" class="width-2">
        <button id="prevEnv" class="button">Previous Environment</button>
        <button id="nextEnv" class="button">Next Environment</button>
        <button id="focusObject" class="button">Focus iPod</button>
        <button id="logDebug" class="button">Log Scene Info</button>
      </div>

      <div class="width-8">
        <a href="/home">
          <img src="images/cpd logo.png" class="cpd-logo"></img>
        </a>
      </div>

      <div id="controls" class="width-2">
        <!-- FOV Range -->
        <label for="fovRange">FOV Range</label>
        <input type="range" id="fovRange" min="1" max="200" value="40" class="slider">
        <!-- X-axis rotation -->
        <label for="rotateX">Rotate X</label>
        <input type="range" id="rotateX" min="-180" max="180" value="0" class="slider">

        <!-- Y-axis rotation -->
        <label for="rotateY">Rotate Y</label>
        <input type="range" id="rotateY" min="-180" max="180" value="0" class="slider">

        <!-- Z-axis rotation -->
        <label for="rotateZ">Rotate Z</label>
        <input type="range" id="rotateZ" min="-180" max="180" value="0" class="slider">
      </div>
    </div>
  </header>

  <script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/",
      "./js/features/": "/js/features/"
				}
			}
		</script>

  <script type="module">

    import { IPodScreen } from './js/features/IPodScreen.js';
    import { EnvironmentSwitcher } from './js/features/EnvironmentSwitcher.js';
    import { CameraManager } from './js/features/CameraManager.js';

    // import from threejs
    import * as THREE from 'three';

    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

    // create variables
    let camera, scene, renderer, model, controls, screenTexture;
    //envTexture
    let ipodScreen;  // Add this for the new class
    let cameraManager;

    let currentTrackUrl = '';

    let isFocusing = false;
    let focusStartTime = 0;
    const focusDuration = 5.0; // seconds

    let startCameraPosition, startCameraTarget, endCameraPosition;

    const envTextures = [
      'assets/sky_02_2k.png',
      'assets/TrainStation.hdr',
      'assets/royal_esplanade_1k.hdr',
      'assets/kloppenheim_02_4k.hdr',
      'assets/lakeside_night_4k.hdr',
      'assets/pedestrian_overpass_4k.hdr',
      'assets/little_paris_under_tower_4k.hdr'
      // https://polyhaven.com/a/pedestrian_overpass
    ];
    console.log('Pre-init check:', {
  THREE: typeof THREE,
  CameraManager: typeof CameraManager,
  cameraManager: cameraManager
});

    // Where you initialize the switcher:
    const envSwitcher = new EnvironmentSwitcher(scene, envTextures);

    document.getElementById('nextEnv').addEventListener('click', () => envSwitcher.next());
    document.getElementById('prevEnv').addEventListener('click', () => envSwitcher.previous());
    document.getElementById('focusObject').addEventListener('click', () => {
      if (screenMesh) cameraManager.focusOnObject(screenMesh);
    });

    // hdri maps
    // const environmentTextures = [
    //   'assets/sky_02_2k.png',
    //   'assets/TrainStation.hdr',
    //   'assets/royal_esplanade_1k.hdr',
    //   'assets/kloppenheim_02_4k.hdr',
    //   'assets/lakeside_night_4k.hdr',
    //   'assets/pedestrian_overpass_4k.hdr',
    //   'assets/little_paris_under_tower_4k.hdr'
    // ];
    // https://polyhaven.com/a/pedestrian_overpass

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let screenMesh = null; // store your screen panel here

    const clock = new THREE.Clock();

    var fovSlider = document.getElementById("fovRange");
    let fov = fovSlider.value;

    fovSlider.oninput = function () {
      fov = this.value;
    }

    const rotateX = document.getElementById('rotateX');
    const rotateY = document.getElementById('rotateY');
    const rotateZ = document.getElementById('rotateZ');

    function updateModelRotation() {
      model.rotation.x = THREE.MathUtils.degToRad(rotateX.value);
      model.rotation.y = THREE.MathUtils.degToRad(rotateY.value);
      model.rotation.z = THREE.MathUtils.degToRad(rotateZ.value);
    }

    rotateX.addEventListener('input', updateModelRotation);
    rotateY.addEventListener('input', updateModelRotation);
    rotateZ.addEventListener('input', updateModelRotation);

    // initiate app
    init();

    window.addEventListener('keydown', function (event) {
      if (!model) return;

      const rotateAmount = Math.PI / 24;

      switch (event.key) {
        case 'ArrowLeft':
          model.rotation.y += rotateAmount;
          break;
        case 'ArrowRight':
          model.rotation.y -= rotateAmount;
          break;
        case 'ArrowUp':
          model.rotation.x += rotateAmount;
          break;
        case 'ArrowDown':
          model.rotation.x -= rotateAmount;
          break;
        default:
          break;
      }
    });

    // spotify get now playing track function
    let pausedStartTime = null;
    const PAUSE_TIMEOUT = 60 * 1000; // 60 seconds in ms

    const favouriteTrack = {
      trackName: 'BUFFALO (feat. Shane Powers)',
      artistName: 'Tyler, The Creator & Shane Powers',
      albumName: 'CHERRY BOMB',
      albumImageUrl: 'assets/cherrybombCover.jpg',
      progressMs: 125000,
      durationMs: 160000,
      isPlaying: false,
      trackUrl: 'https://neal.fun' // Ensure this is valid
    };

    async function fetchNowPlaying() {
      try {
        const response = await fetch('/.netlify/functions/getCurrentTrack');
        if (!response.ok) throw new Error('Network response was not ok');

        const data = await response.json();
        console.log('Fetched data:', data);

        if (data?.error) {
          throw new Error(data.error);
        }

        // Ensure we have fallback values
        const mappedTrackInfo = {
          trackName: data.name || favouriteTrack.trackName,
          artistName: data.artists || favouriteTrack.artistName,
          albumName: data.album || favouriteTrack.albumName,
          albumImageUrl: data.album_image || favouriteTrack.albumImageUrl,
          progressMs: data.progress_ms || favouriteTrack.progressMs,
          durationMs: data.duration_ms || favouriteTrack.durationMs,
          isPlaying: data.is_playing || false,
          trackUrl: data.track_url || favouriteTrack.trackUrl
        };

        currentTrackUrl = mappedTrackInfo.trackUrl; // Explicit assignment
        updateScreen(mappedTrackInfo);

      } catch (error) {
        console.error('Error fetching track info:', error);
        currentTrackUrl = favouriteTrack.trackUrl; // Ensure URL is set
        updateScreen(favouriteTrack);
      }
    }

    console.log('Initialization check:', {
      currentTrackUrl,
      isFocusing,
      cameraManager,
      favouriteTrack
    });

    function updateScreen(trackInfo) {
      currentTrackUrl = trackInfo.trackUrl || favouriteTrack.trackUrl;

      if (!ipodScreen) return; // Safety check
      ipodScreen.updateScreen(trackInfo);
      if (screenTexture) screenTexture.needsUpdate = true;
    }

    function init() {
      const container = document.createElement('div');
      document.body.appendChild(container);

      // set up renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      const header = document.getElementById('header'); // or whatever your header's ID is
      const headerHeight = header ? header.offsetHeight : 0;

      renderer.setSize(window.innerWidth, window.innerHeight - headerHeight);
      renderer.domElement.style.top = `${headerHeight}px`; // move canvas down
      renderer.domElement.style.position = 'absolute'; // make sure it's positioned

      container.appendChild(renderer.domElement);

      // set up the camera fov 35mm
      camera = new THREE.PerspectiveCamera(fov, window.innerWidth / window.innerHeight, 1, 20);
      camera.position.set(0, 0, 3);

      cameraManager = new CameraManager(camera, renderer, {
        damping: 0.05,
        enablePan: false
      });


      // create scene
      scene = new THREE.Scene();

      // load the environment texture
      new RGBELoader().load('assets/little_paris_under_tower_4k.hdr', function (texture) {
        texture.mapping = THREE.EquirectangularReflectionMapping;
        scene.background = texture;
        scene.environment = texture;
        animate();
      });

      ipodScreen = new IPodScreen();

      // load the ipod model
      const loader = new GLTFLoader();
      loader.load('assets/scene.gltf', function (gltf) {
        model = gltf.scene;
        scene.add(model);

        // create texture for screen
        screenTexture = new THREE.CanvasTexture(ipodScreen.canvas);

        // create material using canvas texture
        const screenMaterial = new THREE.MeshBasicMaterial({
          map: screenTexture
        });

        // create 3d plane for ipod screen with updated dimensions
        const screenGeometry = new THREE.PlaneGeometry(0.08, 0.066);  // adjusted dimensions
        const screen = new THREE.Mesh(screenGeometry, screenMaterial);

        screenMesh = screen; // <-- save reference globally

        // place new screen onto the model
        screen.position.set(0.009, 0.0545, 0); // new screen position
        screen.rotation.set(0, Math.PI / 2, 0); // new screen rotation

        // add new screen to ipod
        model.add(screen);
        model.scale.set(5, 5, 5); // scale up screen

        document.getElementById('focusObject').addEventListener('click', () => {
          if (!screenMesh) return;

          const screenWorldPosition = new THREE.Vector3();
          screenMesh.getWorldPosition(screenWorldPosition);

          const screenWorldNormal = new THREE.Vector3(0, 0, 1);
          screenWorldNormal.applyQuaternion(
            screenMesh.getWorldQuaternion(new THREE.Quaternion())
          ).normalize();

          // Configure focus animation
          endCameraPosition = screenWorldPosition.clone()
            .add(screenWorldNormal.multiplyScalar(3)); // 3 units back
          startCameraPosition = camera.position.clone();
          startCameraTarget = cameraManager.controls.target.clone();
          focusStartTime = performance.now() / 1000;
          isFocusing = true;
        });

        document.getElementById('logDebug').addEventListener('click', () => {
          if (!model || !camera) {
            console.warn('Model or camera not loaded yet.');
            return;
          }

          // Log iPod info
          const ipodPosition = model.position;
          const ipodRotation = model.rotation;

          console.log('--- iPod Info ---');
          console.log(`Position: x=${ipodPosition.x.toFixed(3)}, y=${ipodPosition.y.toFixed(3)}, z=${ipodPosition.z.toFixed(3)}`);
          console.log(`Rotation (radians): x=${ipodRotation.x.toFixed(3)}, y=${ipodRotation.y.toFixed(3)}, z=${ipodRotation.z.toFixed(3)}`);
          console.log(`Rotation (degrees): x=${(THREE.MathUtils.radToDeg(ipodRotation.x)).toFixed(1)}°, y=${(THREE.MathUtils.radToDeg(ipodRotation.y)).toFixed(1)}°, z=${(THREE.MathUtils.radToDeg(ipodRotation.z)).toFixed(1)}°`);

          // Log camera info
          const camPosition = camera.position;
          const camRotation = camera.rotation;

          console.log('--- Camera Info ---');
          console.log(`Position: x=${camPosition.x.toFixed(3)}, y=${camPosition.y.toFixed(3)}, z=${camPosition.z.toFixed(3)}`);
          console.log(`Rotation (radians): x=${camRotation.x.toFixed(3)}, y=${camRotation.y.toFixed(3)}, z=${camRotation.z.toFixed(3)}`);
          console.log(`Rotation (degrees): x=${(THREE.MathUtils.radToDeg(camRotation.x)).toFixed(1)}°, y=${(THREE.MathUtils.radToDeg(camRotation.y)).toFixed(1)}°, z=${(THREE.MathUtils.radToDeg(camRotation.z)).toFixed(1)}°`);
          console.log(`FOV: ${camera.fov.toFixed(2)}°`);
          console.log(`Near plane: ${camera.near.toFixed(3)}`);
          console.log(`Far plane: ${camera.far.toFixed(3)}`);
        });

        fetchNowPlaying(); // fetch track info 
        setInterval(fetchNowPlaying, 5000); // update every 5 seconds
        setInterval(updateCameraFov, 1);
      });

      window.addEventListener('resize', onWindowResize);

      renderer.domElement.addEventListener('click', function (event) {
        console.log('Click detected'); // 1. Confirm handler is firing

        if (!screenMesh || !camera) {
          console.warn('Missing required objects:', { screenMesh, camera });
          return;
        }

        const header = document.getElementById('header');
        const headerHeight = header ? header.offsetHeight : 0;

        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -((event.clientY - headerHeight) / (window.innerHeight - headerHeight)) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        if (screenMesh) {
          const intersects = raycaster.intersectObject(screenMesh);
          console.log('Intersections:', intersects); // 2. Check if intersections exist

          if (intersects.length > 0) {
            const intersect = intersects[0];
            console.log('Intersection point:', intersect.point); // 3. Verify intersection data

            // Get the normal in world space
            const normalMatrix = new THREE.Matrix3().getNormalMatrix(intersect.object.matrixWorld);
            const worldNormal = intersect.face.normal.clone().applyMatrix3(normalMatrix).normalize();

            // Get vector from intersection point to camera
            const cameraDirection = camera.position.clone().sub(intersect.point).normalize();

            // Dot product between normal and camera direction
            const dot = worldNormal.dot(cameraDirection);

            console.log('Dot product result:', dot); // 4. Check dot product value
            console.log('Current URL:', currentTrackUrl); // 5. Verify URL exists

            if (dot > 0 && currentTrackUrl) {
              console.log('Opening URL:', currentTrackUrl); // 6. Confirm before opening
              window.open(currentTrackUrl, '_blank');
            }
          }
        }
      });

      renderer.domElement.addEventListener('mousemove', function (event) {
        const header = document.getElementById('header');
        const headerHeight = header ? header.offsetHeight : 0;

        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -((event.clientY - headerHeight) / (window.innerHeight - headerHeight)) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        const intersects = raycaster.intersectObject(screenMesh);

        if (intersects.length > 0) {
          const intersect = intersects[0];

          // Get normal and check facing
          const normalMatrix = new THREE.Matrix3().getNormalMatrix(intersect.object.matrixWorld);
          const worldNormal = intersect.face.normal.clone().applyMatrix3(normalMatrix).normalize();
          const cameraDirection = camera.position.clone().sub(intersect.point).normalize();
          const dot = worldNormal.dot(cameraDirection);

          if (dot > 0) {
            renderer.domElement.style.cursor = 'pointer';
          } else {
            renderer.domElement.style.cursor = 'default';
          }
        } else {
          renderer.domElement.style.cursor = 'default';
        }
      });

      onWindowResize();
      animate();
    }

    // window resize function
    function onWindowResize() {
      if (cameraManager) cameraManager.handleResize();
      if (renderer) {
        const header = document.getElementById('header');
        const headerHeight = header ? header.offsetHeight : 0;
        renderer.setSize(window.innerWidth, window.innerHeight - headerHeight);
      }
    }

    function updateCameraFov() {
      camera.fov = fov;
      camera.updateProjectionMatrix();
    }

    function easeInOutCubic(t) {
      // Bézier-like curve
      return t < 0.5
        ? 4 * t * t * t
        : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function animate() {
      requestAnimationFrame(animate);

      // Safety check
      if (!cameraManager) {
        console.warn('CameraManager not initialized');
        return;
      }

      // Handle focus animation
      if (isFocusing) {
        const currentTime = performance.now() / 1000;
        const elapsed = currentTime - focusStartTime;
        const t = Math.min(elapsed / focusDuration, 1);
        const easedT = easeInOutCubic(t);

        camera.position.lerpVectors(startCameraPosition, endCameraPosition, easedT);
        cameraManager.controls.target.lerpVectors(startCameraTarget, screenMesh.position, easedT);

        if (t >= 1) isFocusing = false;
      }

      cameraManager.update();
      renderer.render(scene, camera);
    }
  </script>
</body>

</html>
