<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smoother Split Image Reveal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            overflow-x: hidden;
            font-family: 'Arial', sans-serif;
        }

        .hero-section {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            overflow: hidden;
            z-index: 1;  /* Keep the split image on top initially */
        }

        .split {
            width: 50%;
            height: 100%;
             /* Replace with your own image */
            background-size: cover;
            background-position: center;
            transition: transform 3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .left {
            transform-origin: left center;
            background-image: url('https://images.unsplash.com/photo-1584009577996-0227b2358356?q=80&w=3270&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
        }

        .right {
            transform-origin: right center;
            background-image: url('https://images.unsplash.com/photo-1495805442109-bf1cf975750b?q=80&w=3270&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
        }

        .scroll-content {
            position: absolute;
            width: 100vw;
            z-index: 0;  /* Content is underneath hero section */
            height: 200vh;  /* Extend page for scrolling */
            background-color: #f0f0f0;
            padding-top: 100vh;  /* Space for hero section to sit above */
        }

        .scroll-content h1 {
            /* margin: 100px auto 20px auto; */
            text-align: center;
            font-size: 2.5rem;
            color: #333;
            opacity: 0;
            animation: fadeIn 2s ease forwards;
            animation-delay: 1.5s;
        }

        .scroll-content p {
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 1.2rem;
            animation: fadeIn 2s ease forwards;
            animation-delay: 2s;
        }

        /* Scroll animation: gently split the image */
        .scrolled .left {
            transform: translateX(-100%);
        }

        .scrolled .right {
            transform: translateX(100%);
        }

        /* Text fade-in animation */
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <!-- Content that will appear underneath -->
    <div class="scroll-content">
        <h1>Welcome to the Real Page</h1>
        <p>This is the main content of the page that gets revealed after scrolling past the image.</p>
    </div>

    <!-- Split hero section -->
    <div class="hero-section">
        <div class="split left"></div>
        <div class="split right"></div>
    </div>

    <script>
        // Add 'scrolled' class to body after scrolling down slightly
        window.addEventListener('scroll', () => {
            if (window.scrollY > 10) {
                document.body.classList.add('scrolled');
            }
        });
    </script>

</body>
</html>
